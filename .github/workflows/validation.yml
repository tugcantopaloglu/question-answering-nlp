name: Retrieval validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt -r requirements-plot.txt
      - name: Run bounded local model fixtures
        run: python -m unittest discover -s tests -v
      - name: Check source security
        run: python -m bandit ana_kod_tugcantopaloglu.py --skip B311
      - name: Audit installed dependencies
        run: python -m pip_audit --progress-spinner off
      - name: Audit upstream PyTorch release for CPU build
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import version
          from pathlib import Path

          installed = version("torch")
          release = installed.split("+", 1)[0]
          path = Path(os.environ["RUNNER_TEMP"]) / "torch-release-audit.txt"
          path.write_text(f"torch=={release}\n", encoding="utf-8")
          print(f"Auditing upstream torch {release} for installed build {installed}")
          PY
          python -m pip_audit --progress-spinner off --disable-pip --no-deps -r "$RUNNER_TEMP/torch-release-audit.txt"
